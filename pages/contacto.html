<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - El mundo del toro de lidia</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <div class="bloque-marfil">
        <header>
            <h1>Formulario de Contacto</h1> <!------------- Formulario de contacto ------------>
            <p>¿Tienes dudas, sugerencias o comentarios sobre el mundo taurino? ¡Escríbenos!</p>
        </header>

        <nav aria-label="Navegación principal">
            <a href="../index.html">Inicio</a>
            <a href="ganaderias.html">Ganaderías y Plazas</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </div>

    <main>
        <section class="bloque-negro">
            <h2>Envíanos tus impresiones</h2> 
            <form action="#" method="post" class="formulario-contacto">
                <div class="campo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required minlength="3" placeholder="Ej.Lorenzo el todo poderoso">
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required placeholder="pepito@ejemplo.com">
                </div>

                <div class="campo">
                    <label for="interes">¿Qué tema te interesa más?</label>
                    <select id="interes" name="interes" required>
                        <option value="" disabled selected>Selecciona una opción...</option>
                        <option value="ganaderias">Ganaderías y Encastes</option>
                        <option value="plazas">Plazas de toros</option>
                        <option value="historia">Historia y Cultura</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required minlength="10" placeholder="Escribe algo aqui..."></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Formulario</button>
            </form>
        </section>
    </main>

    <footer class="seccion-personal">
        <p>&copy; 2026 El mundo del toro de lidia. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
